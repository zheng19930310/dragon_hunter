};
const IMG = {}; let loaded = 0, ready = false;
for (const k in ASSETS) {
  const im = new Image();
  im.onload = () => { if (++loaded === Object.keys(ASSETS).length) { ready = true; layout(); } };
  im.src = 'data:image/webp;base64,' + ASSETS[k];
  IMG[k] = im;
}

let W = 0, H = 0, S = 1, ES = 1, DPR = 1, OX = 0, OY = 0;
let T = 0;
let blPh = -1, blT = 0, blNext = ri(140, 300), blZ = [6, 3, 15], blDbl = false;
let opL = 1, opR = 1; const hist = [], LAG = 2;
let scr = -1;                                       // ≥0：点两侧定住开度做检查
const gz = { x: 0, y: 0, tx: 0, ty: 0, next: 40 };
let mX = 0, mY = 0, mLive = 0;
let tiltX = 0, tiltY = 0, tiltReal = false, tiltSmooth = { x: 0, y: 0 }, tiltBase = null;
const eyeCv = {}, eyeCx = {}, tmpCv = {}, tmpCx = {};

function layout() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  C.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W * 0.94 / IMGW, H * 0.84 / IMGH);
  ES = S * DPR;                                     // 眼贴片内部像素密度
  OX = (W - IMGW * S) / 2; OY = (H - IMGH * S) / 2 - H * 0.02;
  for (const tag of ['L', 'R']) {
    const b = BOX[tag], w = Math.max(2, Math.round((b[2] - b[0]) * ES)), h = Math.max(2, Math.round((b[3] - b[1]) * ES));
    if (!eyeCx[tag]) { eyeCx[tag] = document.createElement('canvas'); tmpCx[tag] = document.createElement('canvas'); }
    eyeCv[tag] = eyeCx[tag]; eyeCv[tag].width = w; eyeCv[tag].height = h;
    tmpCv[tag] = tmpCx[tag]; tmpCv[tag].width = w; tmpCv[tag].height = h;
  }
}

/* ===================== 眨眼 / 姿态 / 注视（B2 已验证参数） ===================== */
function stepBlink() {
  if (scr >= 0) { opL = opR = scr; return; }
  if (blPh < 0) {
    if (--blNext <= 0) { blPh = 0; blT = 0; blZ = [ri(5, 7), ri(2, 4), ri(13, 19)]; blDbl = Math.random() < 0.14; }
  } else {
    blT++;
    if (blT >= blZ[blPh]) {
      blPh++; blT = 0;
      if (blPh === 3) { if (blDbl) { blPh = 0; blT = 0; blDbl = false; } else { blPh = -1; blNext = ri(150, 390); } }
      else if (blPh > 3) { blPh = -1; blNext = ri(150, 390); }
    }
  }
  let v = 1;
  if (blPh === 0) { const u = blT / Math.max(1, blZ[0] - 1); v = 1 - u * u; }
  else if (blPh === 1) v = 0;
  else if (blPh === 2) { const u = blT / Math.max(1, blZ[2] - 1); v = u * (2 - u); }
  opL = cl(v, 0, 1);
  hist.push(opL); if (hist.length > LAG + 2) hist.shift();
  opR = hist.length > LAG ? hist[hist.length - 1 - LAG] : opL;
}
function onOrient(e) {
  if (e.gamma == null && e.beta == null) return;
  tiltReal = true;
  const g0 = e.gamma || 0, b0 = e.beta || 0;
  if (!tiltBase) tiltBase = { g: g0, b: b0 };
  tiltX = cl((g0 - tiltBase.g) / 32, -1, 1);
  tiltY = cl((b0 - tiltBase.b) / 28, -1, 1);
}
function enableTilt() {
  addEventListener('deviceorientation', onOrient, true);
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === 'function') {
    D.requestPermission().then(r => { if (r === 'granted') addEventListener('deviceorientation', onOrient, true); }).catch(() => {});
  }
}
function stepTilt() {
  if (!tiltReal) {
    tiltX = Math.sin(T * 0.006) * 0.55 + Math.sin(T * 0.017 + 1.3) * 0.18;
    tiltY = Math.sin(T * 0.0047 + 0.7) * 0.45 + Math.sin(T * 0.021) * 0.12;
  }
  tiltSmooth.x += (tiltX - tiltSmooth.x) * 0.10;
  tiltSmooth.y += (tiltY - tiltSmooth.y) * 0.10;
}
function stepGaze() {
  let tx = 0, ty = 0;
  if (mLive > 0) {
    mLive--;
    tx += cl((mX - W / 2) / (W * 0.22), -1, 1) * GM.L;
    ty += cl((mY - H * 0.45) / (H * 0.30), -1, 1) * GM.Y;
  } else if (--gz.next <= 0) { gz.tx = rr(-1, 1) * GM.L * 0.75; gz.ty = rr(-1, 1) * GM.Y * 0.7; gz.next = ri(48, 156); }
  tx += gz.tx; ty += gz.ty;
  tx += tiltSmooth.x * GM.L * 0.7 + tiltX * GM.L * 0.2;
  ty += tiltSmooth.y * GM.Y * 0.7 + tiltY * GM.Y * 0.2;
  gz.x += (tx - gz.x) * 0.24 + rr(-0.16, 0.16);
  gz.y += (ty - gz.y) * 0.24 + rr(-0.10, 0.10);
  gz.x = cl(gz.x, -GM.L, GM.L); gz.y = cl(gz.y, -GM.Y, GM.Y);
}

/* ===================== 单眼合成：5 帧交叉淡入 + 虹膜区注视位移回补 ============ */
function drawEye(tag, o) {
  if (!ready || !eyeCv[tag]) return;
  const b = BOX[tag], w = eyeCv[tag].width, h = eyeCv[tag].height;
  const g = eyeCx[tag].getContext('2d'), t = tmpCx[tag].getContext('2d');

  g.clearRect(0, 0, w, h);
  let i = 0; while (i < 4 && o < OPEN[i + 1]) i++;
  const a = OPEN[i], a2 = OPEN[i + 1];
  /* 只在两帧中间一小段窗口内交叉淡入（BW），其余时间停在清晰关键帧上，
     避免"半睁"时出现两条睑缘的重影。 */
  let f = a > a2 ? (a - o) / (a - a2) : 0;
  f = ssm(cl((f - BW) / (1 - 2 * BW), 0, 1));
  g.drawImage(IMG['e' + tag + (i + 1)], 0, 0, w, h);
  if (f > 0.004) { g.globalAlpha = f; g.drawImage(IMG['e' + tag + (i + 2)], 0, 0, w, h); g.globalAlpha = 1; }

  /* 注视位移：只搬"虹膜盘 ∩ 眼裂"，闭合时收敛为 0（避免把睑缘搬出重影） */
  const gate = cl((o - 0.06) / 0.34, 0, 1);
  const dx = gz.x * ES * gate, dy = gz.y * ES * gate;
  if (Math.abs(dx) > 0.6 || Math.abs(dy) > 0.6) {
    t.setTransform(1, 0, 0, 1, 0, 0);
    t.globalCompositeOperation = 'source-over';
    t.clearRect(0, 0, w, h);
    t.drawImage(eyeCv[tag], dx, dy);
    t.globalCompositeOperation = 'destination-in';
    t.drawImage(IMG['msk' + tag], 0, 0, w, h);
    t.globalCompositeOperation = 'source-over';
    g.drawImage(tmpCv[tag], 0, 0);
  }
  C.drawImage(eyeCv[tag], OX + b[0] * S, OY + b[1] * S, (b[2] - b[0]) * S, (b[3] - b[1]) * S);
}

function frame() {
  T++; stepBlink(); stepTilt(); stepGaze();
  if (!ready) { requestAnimationFrame(frame); return; }
  C.fillStyle = '#f7f7f2'; C.fillRect(0, 0, W, H);
  C.drawImage(IMG.base, OX, OY, IMGW * S, IMGH * S);
  drawEye('L', opL);
  drawEye('R', opR);
  requestAnimationFrame(frame);
}

addEventListener('resize', layout);
function pt(e) { const p = e.touches ? e.touches[0] : e; mX = p.clientX; mY = p.clientY; mLive = 90; }
addEventListener('mousemove', pt);
addEventListener('touchmove', pt, { passive: true });
addEventListener('mousedown', tap);
addEventListener('touchstart', e => { pt(e); tap(e); enableTilt(); }, { passive: true });
function tap(e) {
  const p = e.touches ? e.touches[0] : e;
  if (p.clientX < W * 0.28) { scr = 0.75; return; }
  if (p.clientX > W * 0.72) { scr = 0.25; return; }
  scr = -1;
  if (blPh < 0) { blPh = 0; blT = 0; blZ = [ri(5, 7), ri(2, 4), ri(13, 19)]; blDbl = false; }
}

layout();
frame();
</script>
