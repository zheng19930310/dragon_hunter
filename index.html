const VIEW=document.getElementById('game');

let Z=1,DPR=1;
let forceRot=0; // v1.4需求31：CSS 强制旋转标志（当 OS 不支持方向锁时兼容）
function resize(){DPR=window.devicePixelRatio||1;
  if(forceRot){ // 竖屏下“伪横屏”：元素未旋转时 LW*Z 宽 × LH*Z 高，旋转后视觉 = LH*Z 宽 × LW*Z 高；需 LH*Z≤innerWidth & LW*Z≤innerHeight
    Z=Math.min(innerWidth/LH,innerHeight/LW);
    VIEW.style.width=(LW*Z)+'px';VIEW.style.height=(LH*Z)+'px';
    VIEW.style.left=((innerWidth-LH*Z)/2 - (LW*Z-LH*Z)/2 + (LH*Z-LW*Z)/2)+'px'; // 简化：下面直接写
    VIEW.style.left=((innerWidth-LW*Z)/2)+'px';
    VIEW.style.top=((innerHeight-LH*Z)/2)+'px';
  }else{
    Z=Math.min(innerWidth/LW,innerHeight/LH);
    VIEW.style.width=(LW*Z)+'px';VIEW.style.height=(LH*Z)+'px';
    VIEW.style.left='';VIEW.style.top='';
  }
  VIEW.width=Math.round(LW*Z*DPR);VIEW.height=Math.round(LH*Z*DPR);}
addEventListener('resize',function(){
  // OS 方向已实际变横屏时自动退出 CSS 强制旋转
  if(forceRot&&innerWidth>innerHeight){forceRot=0;document.body.classList.remove('force-landscape');}
  resize();});resize();

function drawWeather(){
  const zones=[];
  if(INST.on){if(INST.scene)zones.push([INST.scene.sn,INST.x,INST.y,INST.w,INST.h]);}
  else for(const z in ZONE_SCENE){const r=ZR(z);
    if(r.x>camX+LW+60||r.x+r.w<camX-60||r.y>camY+LH+60||r.y+r.h<camY-60)continue;
    zones.push([ZONE_SCENE[z],r.x,r.y,r.w,r.h]);}

}
function weatherAt(sn,x,y,w,h){

function ambientAt(sn,x,y,w,h){

  else if(m.key==='eagle'){ // V1.8需求10：金翅苍鹰——展翼扑翼+钩喙利爪，悬空滑翔

/* V1.8.1 坐骑精细化：骑手垂腿——抬升 18px 后人物下半身陷入兽背，补一段大腿 + 长靴跨骑在坐骑两侧，
   随移动相位轻摆；坐标沿用主角世界坐标（外层已 translate(0,-18)，故 y 需 +18 回到主角本位） */
function drawRiderLegs(){
  if(p.morph)return; // 变身形态不补腿
  const x=p.x,y=p.y+18-6,swing=(p.mv||0)*Math.sin(p.walk*.42)*2.2;
  C.lineCap='round';
  for(const s of[-1,1]){
    C.strokeStyle='rgba(30,26,20,.85)';C.lineWidth=4.2;
    C.beginPath();C.moveTo(x+s*3.2,y);C.quadraticCurveTo(x+s*8.4,y+6.4,x+s*9.2,y+12.4+swing*s);C.stroke();
    C.fillStyle='#2a2018';rr(x+s*9.2-2.6,y+12.8+swing*s,5.6,4.4,1.6);C.fill(); // 靴
    C.fillStyle='rgba(255,240,200,.16)';C.beginPath();C.arc(x+s*7.4,y+6,1.2,0,7);C.fill(); // 膝盖高光
  }
  C.lineCap='butt';
}
/* V1.7需求1：基地里的坐骑总管——弼马温（独立立绘，靠近可拜见） */

  C.fillStyle='#e8cf4a';C.fillRect(x-9,y-4,18,2.6); // 玉带

  C.fillStyle='#e6b98a';C.beginPath();C.arc(x,y-21,6.6,0,7);C.fill();
  C.fillStyle='#241a12';C.beginPath();C.arc(x-2.4,y-21,1,0,7);C.fill();C.beginPath();C.arc(x+2.4,y-21,1,0,7);C.fill();
  C.fillStyle='#1a2450';rr(x-9,y-33,18,6,2);C.fill();C.fillStyle='#e8cf4a';rr(x-9,y-29,18,2.4,1);C.fill(); // 乌纱官帽

  else if(e==='kb'&&Math.random()<Math.min(.7,.10+pw*.03)){const ang=Math.atan2(m.y-p.y,m.x-p.x);m.x+=Math.cos(ang)*(3+pw*.6);m.y+=Math.sin(ang)*(3+pw*.6);m.stun=Math.max(m.stun||0,8+pw*2);if(Math.random()<.25)floatTxt(m.x,m.y-28,'💨击退','#ffd27a');}
  else if(e==='double'&&Math.random()<Math.min(.6,.06+pw*.025)){hitMob(m,.4+pw*.03,{col:'#ffd700'});floatTxt(m.x,m.y-30,'✦二段','#ffd700');}
  else if(e==='chain'&&t-(p._chainT||0)>400&&Math.random()<Math.min(.9,.15+pw*.04)){p._chainT=t;let best=null,bd=1e9;for(const o of mobs){if(o===m||o.hp<=0)continue;const dd=dist(o.x,o.y,m.x,m.y);if(dd<180&&dd<bd){bd=dd;best=o;}}if(best){fxLightning(best.x,best.y);hitMob(best,.5+pw*.06,{col:'#9adcfa'});floatTxt(m.x,m.y-30,'⚡链式反应','#9adcfa');}}
  else if(e==='leech'&&Math.random()<Math.min(.9,.3+pw*.03)){healPlayer(Math.max(1,Math.round(d*(.06+pw*.01))));floatTxt(p.x,p.y-40,'+'+Math.max(1,Math.round(d*(.06+pw*.01))),'#59e85a');}
  else if(e==='pierce'&&Math.random()<Math.min(.6,.12+pw*.024)){for(const o of mobs){if(o===m||o.hp<=0||o.kind===2)continue;if(Math.abs(angDiff(Math.atan2(o.y-m.y,o.x-m.x),Math.atan2(m.y-p.y,m.x-p.x)))<.35&&dist(p.x,p.y,o.x,o.y)>dist(p.x,p.y,m.x,m.y)){hitMob(o,.4+pw*.03,{col:'#ffd27a'});floatTxt(o.x,o.y-28,'贯穿','#ffd27a');break;}}}
  else if(e==='stunNova'&&Math.random()<Math.min(.5,.06+pw*.02)){for(const o of mobs)if(o!==m&&dist(o.x,o.y,m.x,m.y)<110+pw*4){o.stun=Math.max(o.stun||0,24+pw*6);}fxRing(m.x,m.y,6,110+pw*4,'#ffe14a',2);floatTxt(m.x,m.y-32,'✦震爆','#ffe14a');}
  else if(e==='nova'&&Math.random()<Math.min(.5,.08+pw*.02)){areaDmg(m.x,m.y,70+pw*5,.4+pw*.05,null,null,null,4);fxRing(m.x,m.y,5,70+pw*5,'#fff',2);}
  else if(e==='cleave'&&Math.random()<Math.min(.4,.05+pw*.018)){areaDmg(p.x,p.y,90+pw*6,.35+pw*.04,p.aim,1.6);fxSlash(p.x,p.y,p.aim,90,'#fff',2.2);}
  else if(e==='critAll'&&(m.frzT>0||m.frost>0)){hitMob(m,1,{col:'#ffd700'});floatTxt(m.x,m.y-34,'凝视必暴击!','#ffd700');}
  else if(e==='freezeAll'&&Math.random()<Math.min(.35,.03+pw*.018)){const fz=Math.round(20+pw*3);for(const o of mobs)if(o.x>camX-20&&o.x<camX+LW+20&&o.y>camY-20&&o.y<camY+LH+20)o.frzT=Math.max(o.frzT||0,fz);floatTxt(m.x,m.y-38,'❄全屏凝滞','#7ee0ff');}
  else if(e==='doom'&&m.kind===2&&Math.random()<Math.min(.5,.08+pw*.02)){m.dot={t:150,iv:15,tick:0,dv:Math.max(6,Math.round(d*.2)),col:'#ff6aff'};floatTxt(m.x,m.y-36,'☠灾厄诅咒','#ff6aff');}
  else if(e==='exec'&&m.kind!==2&&m.hp<m.maxhp*(.08+pw*.008)){m.hp=0;floatTxt(m.x,m.y-36,'⚔ 处决','#ff4a4a');shakeN(3);}
}
function applyWfxOnHit(m,d){ // v1.4需求3：主手命中钩子，传奇 wfx + 段 tfx 叠加触发
  if(m.kind===undefined)return;
  const mw=p.equip.mweap;if(!mw)return;
  const w=wfxOf(mw);if(w)applyFxCore(m,d,w.e,w.pw);
  if(mw.tfx&&mw.tfx.e)applyFxCore(m,d,mw.tfx.e,mw.tier||0);
}
function applyWfxOnKill(m){

  const w=wfxOf(mw);const e1=w?w.e:null,pw1=w?w.pw:0;
  const e2=mw.tfx?mw.tfx.e:null,pw2=mw.tier||0;
  const tryGold=function(e,pw){if(e==='goldOnKill'&&Math.random()<Math.min(.9,.3+pw*.035)){const g=Math.round((MT[m.key].coin[0]+MT[m.key].coin[1])/2*(.5+pw*.15));p.gold+=g;floatTxt(m.x,m.y-30,'+'+g+' 金币掠夺','#e8b33a');}};
  tryGold(e1,pw1);if(e2!==e1)tryGold(e2,pw2);
  if(e1==='killBurst'||e2==='killBurst'){const pw=Math.max(pw1,pw2);fxRing(m.x,m.y,6,80+pw*5,'#ff7a3a',3);for(const o of mobs)if(o!==m&&dist(o.x,o.y,m.x,m.y)<80+pw*5)hitMob(o,.4+pw*.05,{col:'#ff7a3a'});}
}

function drawAngelLook(x,y,fr,part){ // 需求52：阶段奖励外观——翅膀(≥10)/头环(≥半数)/天使形态(全部)

        C.fillStyle=g2;C.beginPath();C.moveTo(x+s*3,y-11);

/* v1.4需求18/21：宝宝自动攻击——遍历所有宠物，各自独立锁定最近怪物并发射元素弹 */
function updateBossPet(){
  if(p.dead>0||!started||bagOpen||morphOpen)return;
  const pets=p.pets||[];
  for(let si=0;si<4;si++){
    const pt=pets[si];if(!pt)continue;
    const st=petStage(pt),pp=petPos(si),col=PETDEFS[pt.key].col;
    if(pt.cool>0)pt.cool--;
    let best=null,bd=1e9;
    for(const m of mobs){if(m.hp<=0)continue;const dd=dist(pp.x,pp.y,m.x,m.y);if(dd<300&&dd<bd){bd=dd;best=m;}}
    if(!best||pt.cool>0)continue;
    pt.cool=Math.max(16,48-st*3);
    const ang=Math.atan2(best.y-(pp.y-2),best.x-pp.x);
    for(let i=0;i<7;i++){const f=i/7;parts.push({x:pp.x+(best.x-pp.x)*f,y:(pp.y-2)+(best.y-(pp.y-2))*f,vx:Math.cos(ang)*.6,vy:Math.sin(ang)*.6,col:i%2?col:'#ffffff',t:ri(8,15),s:rnd(2,3.6)});}
    fxRing(best.x,best.y,3,18,col,2);
    burst(pp.x,pp.y-2,col,3);sfx(760+st*20,.04,'triangle',.02);
    hitMob(best,petDmg(pt)/(atkTotal()||1),{col:col});
  }
}

function doSell(bi){

function sellAll(){ // bug1-Bug4：一键出售只卖装备（不含材料/技能书/药水）
  let n=0,sum=0,sk=0;
  for(let i=0;i<bagMax();i++){const it=bag[i];
    if(it&&it.slot!=='pot'&&it.slot!=='mat'&&!it.lock){sum+=sellPrice(it);n++;bag[i]=null;}else if(it&&it.lock&&it.slot!=='pot'&&it.slot!=='mat')sk++;}
  selBag=-1;
  if(!n){msg('背包里没有可出售的装备（已锁定/材料/技能书/药水保留）','#888');return;}
  p.gold+=sum;msg('一键出售 '+n+' 件装备，共 +'+sum+' 金币'+(sk?('（'+sk+' 件已锁定未卖）'):''),'#e8cf4a');arp([660,880,1100],60);
}
function doSort(){ // 需求12：一键整理——同类可叠加合并、按类型/品阶/战力排序，锁定物品保持原位
  const free=[],pinned={};
  for(let i=0;i<bagMax();i++){const it=bag[i];if(!it)continue;
    if(it.lock){pinned[i]=it;bag[i]=null;}else{free.push(it);bag[i]=null;}}
  const stackMap={},out=[];
  for(const it of free){
    if(it.slot==='pot'||it.slot==='mat'||it.book){const key=(it.book||it.slot)+'|'+it.name;
      if(stackMap[key]&&(stackMap[key].count||1)<99){stackMap[key].count=Math.min(99,(stackMap[key].count||1)+(it.count||1));continue;}
      it.count=it.count||1;stackMap[key]=it;}
    out.push(it);}
  const rank=it=> it.slot==='mat'?0 : it.book?1 : it.slot==='pot'?2 : 3+Math.max(0,EQSLOTS.indexOf(it.slot));
  out.sort(function(a,b){return rank(a)-rank(b)||(b.q||0)-(a.q||0)||(b.power||0)-(a.power||0);});
  let oi=0;
  for(let i=0;i<bagMax();i++){if(pinned[i])bag[i]=pinned[i];else if(oi<out.length)bag[i]=out[oi++];}
  selBag=-1;msg('🧹 已整理背包（'+out.length+' 件归位，'+Object.keys(pinned).length+' 件锁定未动）','#8ab8d8');sfx(880,.1,'triangle',.05);
}

  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.12;if(--q.t<=0)parts.splice(i,1);}

  for(let i=msgs.length-1;i>=0;i--){if(--msgs[i].t<=0)msgs.splice(i,1);}

  C.beginPath();C.arc(x,y,s*.52,a0,a0+3.5);C.stroke();C.beginPath();C.arc(x,y,s*.52,a0+3.14,a0+6.64);C.stroke();C.setLineDash([]);C.globalAlpha=1;

function mobAura(m){ // bug1-新33：普通怪暗红威肱光环、精英/BOSS更强

  const rgb=m.kind===2?'255,50,35':m.kind===1?'70,150,255':'190,55,40';
  const pl=.5+.5*Math.sin(t*.08+m.id);
  const al=(m.kind?.4:.14)*(0.7+pl*.5);
  const g=C.createRadialGradient(m.x,m.y,2,m.x,m.y,r);
  g.addColorStop(0,'rgba('+rgb+','+al+')');g.addColorStop(1,'rgba(0,0,0,0)');

     外环正转、内环逆转，带浮动呼吸，使威压不再只是一团径向渐变 */
  if(m.kind){
    const rr2=r*.82,sp2=m.kind===2?.012:.02,dir2=m.kind===2?1:-1;
    C.save();C.translate(m.x,m.y);C.globalAlpha=.34+.2*pl;
    C.strokeStyle='rgba('+rgb+',.65)';C.lineWidth=1.2;
    C.beginPath();C.arc(0,0,rr2,t*dir2*sp2,t*dir2*sp2+5.2);C.stroke();
    C.beginPath();C.arc(0,0,rr2*.78,-t*dir2*sp2*1.6,-t*dir2*sp2*1.6+4.4);C.stroke();
    for(let i=0;i<6;i++){const a2=t*dir2*sp2+i*Math.PI/3,rx=Math.cos(a2)*rr2,ry=Math.sin(a2)*rr2;
      C.save();C.translate(rx,ry);C.rotate(a2);C.globalAlpha=.3+.38*Math.sin(t*.1+i);

    C.restore();C.globalAlpha=1;}
}

const CRE_PARTS=[['hat','帽子',['猎帽','铁盔','不戴帽']],['face','脸形',['圆脸','国字脸','瓜子脸']],['hair','头发',['短发','长发','刺猬头']],['top','上衣',['猎装斗篷','蓝法袍','红皮甲']],['pants','裤子',['皮长裤','灰布裤','深蓝裤']],['shoe','鞋',['硬皮靴','棕凉鞋','灰轻靴']]];
function shade6(hex,d){ // v1.4需求29：#rrggbb 亮度偏移工具（d>0 变亮，d<0 变暗），用于体积光影渐变
  const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(function(c){return c+c;}).join(''):h,16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.max(0,Math.min(255,r+d));g=Math.max(0,Math.min(255,g+d));b=Math.max(0,Math.min(255,b+d));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
/* V1.8.1 人物精细化：在 v1.4 捏脸体系上叠四层生命感——
   1) 跑动 / 冲刺时后发、双鬓、发梢、衣摆按速度反向飘动

   3) 头部受光轮廓光 + 眼神光
   4) 冲刺速度线与相位残光（在 drawPlayer 内） */
function drawHunterLook(x,y,fr,bob,st,g,fc){

function drawPlayer(){
  const x=p.x,y=p.y,fr=p.dir;
  if(p.inv>0&&(t>>2)%2)return;
  C.fillStyle='rgba(0,0,0,.3)';C.beginPath();C.ellipse(x,y+16,11,4,0,0,7);C.fill();
  if(p.morph){ // 需求71：变身怪物形态（保留成就装扮+倒计时条）；v1.4需求19：精英/BOSS形态附光环与体型缩放
    const tier=p.morph.tier||0;
    if(tier){const sc=tier===2?1.55:1.12,gcol=tier===2?'#ff3a2a':'#4aa8ff';
      const gg=C.createRadialGradient(x,y,4,x,y,34*sc);gg.addColorStop(0,gcol);gg.addColorStop(1,'rgba(0,0,0,0)');
      C.globalAlpha=.5+.3*Math.sin(t*.1);C.fillStyle=gg;C.beginPath();C.arc(x,y,34*sc,0,7);C.fill();C.globalAlpha=1;
      C.save();C.translate(x,y);C.scale(sc,sc);C.translate(-x,-y);}
    const mm={x:x,y:y,id:1,key:p.morph.key,flash:p.flash>0?5:0,frost:0,dot:null,stun:0,aggro:false,kind:tier,hp:1,maxhp:1,cool:0,scool:0,shT:0,hopT:0,mv:p.mv,walk:p.walk,dir:fr};
    drawMobArt(mm);
    if(tier)C.restore();
    drawCosmetics(x,y-4);
    const r2=(MT[p.morph.key].r||9)*(tier===2?1.55:tier===1?1.12:1);
    C.fillStyle='rgba(0,0,0,.6)';C.fillRect(x-21,y+r2+12,42,4);
    C.fillStyle='#c9a2ff';C.fillRect(x-21,y+r2+12,42*p.morph.i/MORPH_DUR,4);
    txt('🌀'+MORPH_FORM[tier]+'·'+MT[p.morph.key].name+' '+Math.ceil(p.morph.i/60)+'s',x,y+r2+24,10,'#c9a2ff','center');
    return;}
  /* V1.9.12需求2：主角攻击/施法动作——攻击沿瞄准方向前冲（近战深、远程轻后坐），
     施法整体升腾蓄势并在手前凝聚光核。用 translate 包裹 翅膀+身体+装扮+武器，整组同步动。 */
  let ALX=0,ALY=0,WROT=0,CASTG=0;
  if(p.atkAct>0){const f=1-Math.min(1,p.atkAct/(p.atkDur||ACT_MELEE)),pu=Math.sin(f*Math.PI);
    const dd=p.atkBack?7:11;ALX=Math.cos(p.aim)*pu*dd;ALY=Math.sin(p.aim)*pu*dd*.7;
    WROT=pu*(p.atkBack?.18:1.62);}
  if(p.castAct>0){const cf=1-Math.min(1,p.castAct/ACT_CAST);CASTG=Math.sin(cf*Math.PI);ALY-=CASTG*4.5;}
  C.save();C.translate(ALX,ALY);
  if(p.qv>=10)drawAngelLook(x,y,fr,'back'); // V1.9.12需求4：身体前只画背翼
    for(let i=0;i<NPCS.length;i++)NPCS[i].sayT=Math.max(0,(NPCS[i].sayT||0)-1);
  // v2.0 需求4：装备穿在身上不再染色显示；需求80：造型由捏脸决定
  if(p.fury>0){C.strokeStyle='rgba(210,58,58,'+(.4+Math.sin(t*.3)*.2)+')';C.lineWidth=3;C.beginPath();C.arc(x,y-2,20,0,7);C.stroke();}
  const mv=p.mv||0,sw=mv?Math.sin(p.walk*.32):0,bob=mv?Math.abs(Math.sin(p.walk*.32))*2:0,st=sw*3.4;
  drawHunterLook(x,y,fr,bob,st);
  /* V1.8.1 人物精细化：冲刺速度线 + 无敌相位光环——沿冲刺反方向拉出，
     画在身体之后、武器之前；因 drawPlayer 在闪身帧提前 return，光环会随之闪烁，正好是相位感的预期效果。 */
  if(p.dashT>0){
    const da=Math.atan2(p.dvy,p.dvx),f=p.dashT/DASH.T;
    C.save();C.globalAlpha=.32+f*.44;C.strokeStyle='#cfeeff';C.lineWidth=1.7;C.lineCap='round';
    for(let i=0;i<7;i++){const off=(i-3)*3.6,px2=x-Math.cos(da)*(15+f*26)-Math.sin(da)*off,py2=y-6-Math.sin(da)*(15+f*26)+Math.cos(da)*off;
      C.beginPath();C.moveTo(px2,py2);C.lineTo(px2-Math.cos(da)*(9+f*26),py2-Math.sin(da)*(9+f*26));C.stroke();}
    C.restore();}
  if(p.inv>0&&p.dashT>0){const r2=17+(DASH.T-p.dashT)*1.1;
    C.strokeStyle='rgba(154,220,250,'+(.16+.2*Math.sin(t*.4)).toFixed(3)+')';C.lineWidth=2.4;
    C.beginPath();C.arc(x,y-4,r2,0,7);C.stroke();
    C.strokeStyle='rgba(234,246,255,.5)';C.lineWidth=1;C.beginPath();C.arc(x,y-4,r2*.72,0,7);C.stroke();}
  if(p.qv>=Math.ceil(QALL/2))drawAngelLook(x,y-bob,fr,'front'); // V1.9.12需求4：身体后只画头环/光轮，不再重画整翼
  drawCosmetics(x,y-bob); // 需求72：每5成就一件的外显装扮
  const wi=p.equip.mweap?p.equip.mweap.w&&WTYPE[p.equip.mweap.w].i+'@'+(p.equip.mweap.tier||0):'bow@0';
  // bug1-新17：不再按移动方向翻转旋转角，改为沿瞄准轴镜像，避免弓箭朝向反；新3：黄品以上光效
  const flipL=Math.cos(p.aim)<0,mwq=p.equip.mweap?p.equip.mweap.q:0;
  C.save();C.translate(p.x+Math.cos(p.aim)*17,p.y-6-bob+Math.sin(p.aim)*17);C.rotate(p.aim);if(flipL)C.scale(1,-1);
  if(WROT)C.rotate(WROT*(flipL?-1:1)); // V1.9.12需求2：近战挥砍扫过 / 远程轻微后坐（镜像系取反保证左右一致）
  if(mwq>=3){C.shadowColor=QC[mwq];C.shadowBlur=13;}
  iconR(wi,0,0,26,0);
  if(CASTG>0){ // V1.9.12需求2：施法光核——手前凝聚的五行光球
    const ec=(EL[wEl()||'wood']||{}).col||'#9adcfa';
    C.save();C.globalAlpha=.35+CASTG*.6;C.shadowColor=ec;C.shadowBlur=14*CASTG;C.fillStyle=ec;
    C.beginPath();C.arc(15,0,3+CASTG*5,0,7);C.fill();
    C.globalAlpha=.9;C.fillStyle='#ffffff';C.beginPath();C.arc(15,0,1.6+CASTG*2.2,0,7);C.fill();C.restore();}
  C.restore();
  C.restore(); // V1.9.12需求2：结束攻击/施法整组位移
  if(p.iai>0){C.strokeStyle='rgba(238,244,250,'+(.9-p.iai/20)+')';C.lineWidth=4-p.iai/5;C.beginPath();C.arc(x,y-6,34,(p.aim-1)+(16-p.iai)*.12,(p.aim+1)+(16-p.iai)*.12);C.stroke();}
  if(p.flash>0){C.fillStyle='rgba(232,90,90,.4)';C.beginPath();C.arc(x,y-4,16,0,7);C.fill();}
  if(p.dashCd>0){C.fillStyle='rgba(120,180,255,.75)';C.fillRect(x-10,y+20,20*(1-p.dashCd/DASH.CD),2.5);}
}

function mobSprite(m){return Math.max(0,(m.sqT||0)/7);} // 受击挤压强度 0~1
function mobArtBody(m){const k=m.key;
  if(k==='slime')drawSlime(m);else if(k==='fire')drawFire(m);else if(k==='goblin')drawGoblin(m);else if(k==='knight')drawKnight(m);

  else if(k==='wind')drawWind(m);else if(k==='scorp')drawScorp(m);else if(k==='rock')drawRock(m);
  else if(k==='mage')drawMage(m);else if(k==='lava')drawLava(m);else if(k==='ascend')drawAscend(m);
  else if(k==='xuanwu'||k==='qinglong'||k==='baihu'||k==='zhuque')drawSigil(m);
  else if(k==='marsh'||k==='cliff'||k==='icef'||k==='altar'||k==='god')drawBeastNew(m);
  else if(k.length===4&&k.charAt(0)==='z'&&k.charAt(1)==='o')drawZodiac(m);
  else drawTurtle(m);}
function drawMobArt(m){
  const sq=mobSprite(m),r=m.r||9;
  const breathe=1+Math.sin(t*.05+m.id)*.018;                       // 待机呼吸（各怪按 id 错相）
  let sx=(2-breathe)*(1+sq*.12),sy=breathe*(1-sq*.18);             // 挤压：竖压横弹，体积近似守恒
  /* V1.9.12需求2：怪物攻击/施法动作——近战朝玩家扑冲再回弹、远程后坐、施法整体鼓胀+脚下聚能环。
     变身假怪对象与图鉴预览无玩家参照时安全跳过，只保留原有呼吸形变。 */
  let ox=0,oy=0,castF=0;
  if(typeof p!=='undefined'&&p){
    if(m.aAct>0){const f=1-Math.min(1,m.aAct/(m.aDur||ACT_MELEE)),pu=Math.sin(f*Math.PI);
      const a=Math.atan2(p.y-m.y,p.x-m.x),sg=m.aBack?-1:1;
      ox=Math.cos(a)*pu*(m.aBack?4:11)*sg;oy=Math.sin(a)*pu*(m.aBack?3:8)*sg;
      if(m.aBack){sx*=1-pu*.07;sy*=1+pu*.05;}else{sx*=1+pu*.13;sy*=1-pu*.09;}}
    if(m.cAct>0){const fc=1-Math.min(1,m.cAct/ACT_CAST);castF=Math.sin(fc*Math.PI);
      sx*=1+castF*.14;sy*=1+castF*.1;}
  }
  C.save();C.translate(m.x+ox+(m.flash>0?rnd(-1.2,1.2):0),m.y+oy);
  C.scale(sx,sy);
  C.translate(-m.x,-m.y);
  if(castF>0){ // 施法聚能环：脚下亮起蓄能光环
    const col=(MT[m.key]&&MT[m.key].col)||'#ffd27a';
    C.save();C.globalAlpha=castF*.85;C.strokeStyle=col;C.lineWidth=2+castF*1.6;
    C.shadowColor=col;C.shadowBlur=10*castF;
    C.beginPath();C.ellipse(m.x,m.y+r*.62,r*(.9+castF*.5),r*(.3+castF*.16),0,0,7);C.stroke();
    C.globalAlpha=castF*.28;C.fillStyle=col;
    C.beginPath();C.arc(m.x,m.y-r*.3,r*(.5+castF*.55),0,7);C.fill();C.restore();}
  mobArtBody(m);
  if(m.flash<=0){ // 背光轮廓光：受闪白时不叠加，避免整只洗白
    C.strokeStyle='rgba(255,238,200,.13)';C.lineWidth=1.5;
    C.beginPath();C.arc(m.x,m.y-r*.55,r*1.04,3.35,5.55);C.stroke();
    C.strokeStyle='rgba(0,0,0,.13)';C.lineWidth=1.2;
    C.beginPath();C.arc(m.x,m.y-r*.55,r*1.04,.3,2.1);C.stroke();}
  C.restore();
}

function drawCosmetics(x,y){
  const n=Math.min(10,Math.floor(p.qv/5));if(n<=0)return;
  if(n>=1){ // 1 魂火肩饰：双肩冷焰
    for(const s of[-1,1]){const sx=x+s*10,sy=y-13-((t>>3)&1);
      const g=C.createRadialGradient(sx,sy,1,sx,sy,7);g.addColorStop(0,'rgba(140,220,255,.95)');g.addColorStop(1,'rgba(60,120,255,0)');
      C.fillStyle=g;C.beginPath();C.arc(sx,sy,7,0,7);C.fill();}
  }
  if(n>=2){ // 2 星河披帛：环绕星点
    for(let i=0;i<6;i++){const a=t*.06+i*1.05;
      C.fillStyle='rgba(200,180,255,'+(.3+.4*Math.sin(t*.1+i*2))+')';
      C.beginPath();C.arc(x+Math.cos(a)*16,y-8+Math.sin(a)*4,1.6,0,7);C.fill();}
  }
  if(n>=3){ // 3 晚霞云裳：飘动绨纱

    const g3=C.createLinearGradient(x,y-14,x-14+sw,y+14);g3.addColorStop(0,'rgba(255,150,90,.9)');g3.addColorStop(1,'rgba(190,70,160,.25)');

  }
  if(n>=4){ // 4 虹彩双环：交替旋转椭圆环
    C.save();C.globalAlpha=.5;
    C.strokeStyle='#ff8a6a';C.lineWidth=1.6;C.beginPath();C.ellipse(x,y+2,20,7,Math.sin(t*.03)*.5,0,7);C.stroke();
    C.strokeStyle='#7ad0ff';C.beginPath();C.ellipse(x,y+2,20,7,Math.sin(t*.03)*.5+2.1,0,7);C.stroke();C.restore();
  }
  if(n>=5){ // 5 凯旋羽冠：金冠+白羽
    C.fillStyle='#ffd700';C.beginPath();C.moveTo(x-6,y-25);C.lineTo(x-3,y-30);C.lineTo(x,y-26);C.lineTo(x+3,y-30);C.lineTo(x+6,y-25);C.closePath();C.fill();
    C.strokeStyle='#fff';C.lineWidth=1.4;C.beginPath();C.moveTo(x+4,y-29);C.quadraticCurveTo(x+9,y-36,x+7,y-40);C.stroke();
  }
  if(n>=6){ // 6 龙影盘绕：迷你青龙环身飞行
    const a6=t*.05;
    for(let i=0;i<5;i++){const aa=a6-i*.34;
      C.fillStyle='rgba(90,220,160,'+(.75-i*.13)+')';
      C.beginPath();C.arc(x+Math.cos(aa)*22,y-6+Math.sin(aa)*8,3.6-i*.5,0,7);C.fill();}
    C.fillStyle='#bfffe8';C.beginPath();C.arc(x+Math.cos(a6)*22,y-6+Math.sin(a6)*8,4,0,7);C.fill();
  }
  if(n>=7){ // 7 霜骨冰魄：肩头冰晶+寒气领域
    C.strokeStyle='#bfe8ff';C.lineWidth=1.6;
    for(const s of[-1,1]){const ix=x+s*12,iy=y-11;
      C.beginPath();C.moveTo(ix,iy-5);C.lineTo(ix,iy+5);C.moveTo(ix-4,iy-2);C.lineTo(ix+4,iy+2);C.moveTo(ix-4,iy+2);C.lineTo(ix+4,iy-2);C.stroke();}
    C.fillStyle='rgba(180,225,255,.16)';C.beginPath();C.arc(x,y,18,0,7);C.fill();
  }
  if(n>=8){ // 8 紫电绕身：跳动电弧
    if((t>>2)%3!==0){C.strokeStyle='#c9a2ff';C.lineWidth=1.4;C.beginPath();

      C.stroke();}
  }
  if(n>=9){ // 9 浴火凰环：头顶火圈+绕飞火羽

  }
  if(n>=10){ // 10 不灭金身：金色轮光呼吸
    const g10=C.createRadialGradient(x,y-4,4,x,y-4,30);
    g10.addColorStop(0,'rgba(255,225,130,'+(.2+.06*Math.sin(t*.1))+')');g10.addColorStop(1,'rgba(255,215,80,0)');

  }

/* ===== 需求62：长时间移动后全屏风向速度线，表达奔跑如飞 ===== */
function drawRunWind(){
  if(p.runT<150||p.dead>0||bagOpen||skPanel||charPanel||chestOpen)return;
  const a=Math.min(.5,(p.runT-150)/500);
  const ca=Math.cos(p.movA),sa=Math.sin(p.movA);
  C.save();C.globalAlpha=a;C.strokeStyle='rgba(220,235,255,.7)';C.lineCap='round';
  for(let i=0;i<16;i++){
    const sd=((i*137+t*13)%1000)/1000,l2=((i*61+t*19)%1000)/1000;
    const px=(sd*LW-ca*300+LW*2)%LW,py=l2*LH;
    const len=26+(i*29)%44;
    C.lineWidth=1+((i*7)%3)*.8;
    C.beginPath();C.moveTo(px,py);C.lineTo(px-ca*len,py-sa*len);C.stroke();
  }
  C.globalAlpha=Math.min(.9,a*2.2);C.fillStyle='#dff0ff'; // 风向指示箭头（屏幕边缘，顺风方向）
  C.save();C.translate(clamp(LW/2+ca*235,26,LW-26),clamp(LH/2+sa*155,26,LH-26));C.rotate(Math.atan2(sa,ca));
  C.beginPath();C.moveTo(-14,0);C.lineTo(4,-8);C.lineTo(4,-3);C.lineTo(14,-3);C.lineTo(14,3);C.lineTo(4,3);C.lineTo(4,8);C.closePath();C.fill();C.restore();
  C.restore();
}

/* ============ 本地存档（bug1-新23）：等级/加点/属性/装备/背包 → localStorage ============ */
const SAVE_KEY='dlhunter_save_v2';// 兼容旧版（不再写入）
const SLOTN=10;let curSlot=-1; // 需求34：最多 10 个人物存档位；curSlot=当前档位
function slotKey(i){return 'dlhunter_slot_'+i;}
let lastSave=0,wipeArm=0,reArm=0; // 保存时间戳 + 危险操作二次确认计时
const CONT={x:LW/2-150,y:396,w:300,h:36};
function slotRect(i){const cols=5,cw=168,ch=58,gapx=10,gapy=14,gx=(LW-(cols*cw+(cols-1)*gapx))/2,gy=250;const r=Math.floor(i/cols),c=i%cols;return{x:gx+c*(cw+gapx),y:gy+r*(ch+gapy),w:cw,h:ch};}
function slotMeta(i){try{const d=JSON.parse(localStorage.getItem(slotKey(i)));if(!d||!d.p)return null;return{lvl:d.p.lvl|0,gold:d.p.gold|0,n:d.n|0,name:d.name||'无名猎人',gender:d.gender||'男',at:d.at||0};}catch(e){return null;}}
function saveMeta(){return curSlot>=0?slotMeta(curSlot):null;}
function stripItem(it){if(!it)return null;const c={};for(const k in it){if(k==='x'||k==='y'||k==='t'||k==='bob')continue;if(typeof it[k]==='function')continue;c[k]=it[k];}return c;}
function doSave(quiet){
  if(!started||curSlot<0)return false; // 未分配档位（未创建角色）不写入
  try{
    const eq={};for(const s of EQSLOTS)eq[s]=stripItem(p.equip[s]);
    const b=[];let n=0;
    for(let i=0;i<bagMax();i++){const c=stripItem(bag[i]);b.push(c);if(c)n++;}
    const ch=chest.map(stripItem);let cn=0;for(const c of ch)if(c)cn++; // 需求14：仓库数据存入缓存
    const d={v:2,at:Date.now(),n:n,name:p.name,gender:p.gender,p:{x:INST.on?INST.homeX:p.x,y:INST.on?INST.homeY:p.y,hp:p.hp,mp:p.mp,lvl:p.lvl,exp:p.exp,gold:p.gold,aim:p.aim,ap:p.ap,st:p.st,books:p.books,slots:p.slots,skLvl:p.skLvl,skUse:p.skUse,store:p.store,ek:p.ek,kills:p.kills,bagRows:p.bagRows,qs:p.qs,qa:p.qa,qv:p.qv,main:p.main,encN:p.encN,npcT:p.npcT,autoSell:p.autoSell,colEq:p.colEq,colMat:p.colMat,face:p.face,pets:p.pets,ach2:p.ach2,morphUsed:p.morphUsed,mounts:p.mounts,mr:!!p.mr,set:p.set,bless:p.bless,equip:eq},bag:b,ch:ch}; // v1.4需求21：pets入档；v1.4需求27/28：ach2/morphUsed 入档
    localStorage.setItem(slotKey(curSlot),JSON.stringify(d));
    lastSave=Date.now();
    if(!quiet)msg('💾 '+p.name+'（档'+(curSlot+1)+'）已保存：Lv'+p.lvl+' · 背包 '+n+' 件 · 仓库 '+cn+' 件','#8fd08f');
    return true;
  }catch(e){if(!quiet)msg('存档失败：浏览器不允许本地存储','#e85a5a');return false;}
}
function doLoad(quiet,slot){
  if(slot!=null)curSlot=slot;
  const m=saveMeta();if(!m){if(!quiet)msg('没有找到本地存档','#888');return false;}
  let d=null;try{d=JSON.parse(localStorage.getItem(slotKey(curSlot)));}catch(e){}
  if(!d||!d.p){if(!quiet)msg('本地存档已损坏','#e85a5a');return false;}
  if(!started)start();
  const q=d.p;
  p.name=d.name||'无名猎人';p.gender=d.gender||'男'; // 需求33：读档还原姓名/性别
  p.lvl=Math.max(1,q.lvl|0);p.exp=q.exp|0;p.gold=Math.max(0,q.gold|0);p.ap=q.ap|0;
  if(q.x)p.x=q.x;if(q.y)p.y=q.y;p.aim=q.aim||0;
  STKEYS.forEach(function(k){p.st[k]=(q.st&&q.st[k]|0)||0;});

  else updateFx();
  if(started)updateBless(); // V1.8需求3/5：祝福弹幕与屏幕粒子（面板开启也照常飞）
    if(started&&p.dead===0&&t%600===0)setTimeout(function(){doSave(true);},0); // bug1-新23：每 10 秒异步自动存档
  draw();
  requestAnimationFrame(loop);
}
